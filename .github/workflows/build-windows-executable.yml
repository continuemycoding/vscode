name: Build Windows desktop (executable)

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  VSCODE_QUALITY: oss
  NPM_ARCH: x64
  VSCODE_ARCH: x64

jobs:
  build:
    name: Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Prepare node_modules cache key
        shell: pwsh
        run: |
          mkdir .build -ea 0
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts win32 ${{ env.VSCODE_ARCH }} $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: .build/node_modules_cache
          key: node_modules-windows-${{ hashFiles('.build/packagelockhash') }}

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        shell: pwsh
        run: 7z.exe x .build/node_modules_cache/cache.7z -aoa

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 5; $i++) {
            try {
              exec { npm ci }
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "npm ci failed after 5 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          npm_config_foreground_scripts: "true"
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create node_modules archive
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt }
          # 勿用 exec 包 cmdlet：新开 shell 时 $LASTEXITCODE 可能为 $null，会与 0 不相等而误杀（见 exec.ps1）。
          New-Item -ItemType Directory -Path .build/node_modules_cache -Force | Out-Null
          exec { 7z.exe a .build/node_modules_cache/cache.7z -mx3 `@.build/node_modules_list.txt }

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build/node_modules_cache
          key: node_modules-windows-${{ hashFiles('.build/packagelockhash') }}

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@v5
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: builtin-extensions-${{ hashFiles('.build/builtindepshash') }}

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save built-in extensions cache
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: builtin-extensions-${{ hashFiles('.build/builtindepshash') }}

      # 缓存已解压的 Electron + zip；命中时可跳过下载（core-ci-desktop 仍每次跑）。
      - name: Restore Electron cache
        id: cache-electron
        uses: actions/cache/restore@v5
        with:
          path: |
            .build/electron
            .build/electron-cache
          key: electron-win32-${{ hashFiles('.npmrc') }}

      # 不编译/打包内置 Copilot；prepareBuiltInCopilotRipgrepShim 在扩展缺失时会跳过。
      # cache miss：Electron 下载与 core-ci-desktop 并行；cache hit：只跑 core-ci-desktop。
      - name: Download Electron、core-ci-desktop
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          if ("${{ steps.cache-electron.outputs.cache-hit }}" -eq "true") {
            exec { npm run core-ci-desktop }
          } else {
            exec { npm exec -- npm-run-all2 -lp "electron ${{ env.VSCODE_ARCH }}" core-ci-desktop }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          electron_config_cache: ${{ github.workspace }}/.build/electron-cache

      - name: Save Electron cache
        if: steps.cache-electron.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .build/electron
            .build/electron-cache
          key: electron-win32-${{ hashFiles('.npmrc') }}

      - name: 打包桌面客户端（vscode-win32-x64-min-ci）
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          # Add Windows SDK to PATH for patchWin32DependenciesTask signtool usage.
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdk = @(
            (Join-Path $sdkBin "10.0.26100.0\x64")
            Get-ChildItem -LiteralPath $sdkBin -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName "x64" }
          ) | Where-Object { Test-Path -LiteralPath (Join-Path $_ "signtool.exe") } |
            Select-Object -First 1
          if (-not $sdk) {
            throw "signtool.exe not found under Windows Kits; install Windows SDK or update PATH."
          }
          Write-Host "Using Windows SDK signtool from: $sdk"
          $env:PATH = "$sdk;$env:PATH"
          exec { npm run gulp "vscode-win32-${{ env.VSCODE_ARCH }}-min-ci" }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建期从 Marketplace 拉取简体中文语言包，烘焙 resources/app/nls.messages.json（首次启动即中文；不装进 bootstrap）。
      - name: Bake Simplified Chinese NLS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = (Resolve-Path "$env:GITHUB_WORKSPACE\..\VSCode-win32-$env:VSCODE_ARCH").Path
          node .github/scripts/bake-zh-hans-nls.mjs --app-root $out

      # 首次启动由 DefaultExtensionsInitializer 安装 bootstrap/extensions/*.vsix（用户扩展，仅 Windows）。
      - name: 下载预装 VSIX 到 bootstrap/extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = (Resolve-Path "$env:GITHUB_WORKSPACE\..\VSCode-win32-$env:VSCODE_ARCH").Path
          $dest = Join-Path $out "bootstrap\extensions"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $vsixUrls = @(
            "https://gitee.com/RemotePro/RemotePro-vsix/releases/download/1.2.7/remotepro-1.2.7.vsix"
            "https://gitcode.com/gcw_uHaLXrdK/Dopamine/releases/download/2.4.9/claude-dev-4.0.0.vsix"
          )

          foreach ($url in $vsixUrls) {
            $name = Split-Path -Leaf ([Uri]$url).AbsolutePath
            $file = Join-Path $dest $name
            Write-Host "Downloading $url -> $file"
            $ok = $false
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing
                if ((Test-Path -LiteralPath $file) -and (Get-Item -LiteralPath $file).Length -ge 100) {
                  $ok = $true
                  break
                }
                throw "Empty or missing file after download"
              }
              catch {
                if ($i -eq 3) { throw }
                Write-Host "Download failed attempt $i, retrying... $_"
                Start-Sleep -Seconds 5
              }
            }
            if (-not $ok) {
              throw "Failed or empty download: $url"
            }
            Write-Host ("Downloaded {0} ({1} bytes)" -f $name, (Get-Item -LiteralPath $file).Length)
          }

      # 产物在仓库上一级。先打基础树快照，再按语言扇出（工具链留在包内，首次启动只写 PATH）。
      - name: 备份基础包并按语言扇出 ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = (Resolve-Path "$env:GITHUB_WORKSPACE\..\VSCode-win32-$env:VSCODE_ARCH").Path
          $cache = Join-Path $env:GITHUB_WORKSPACE ".build\devenv-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE "dist") | Out-Null

          $baseArchive = Join-Path $env:GITHUB_WORKSPACE ".build\VSCode-win32-$env:VSCODE_ARCH-base.7z"
          if (Test-Path -LiteralPath $baseArchive) { Remove-Item -LiteralPath $baseArchive -Force }
          Write-Host "Archiving base tree -> $baseArchive"
          & 7z.exe a -t7z -mx3 $baseArchive "$base\*" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7z archive base failed: $LASTEXITCODE" }

          $languages = @('go', 'python', 'nodejs', 'cpp', 'csharp', 'rust')
          foreach ($lang in $languages) {
            Write-Host "==== Staging language: $lang ===="
            $outName = "VSCode-win32-$env:VSCODE_ARCH-$lang"
            $outDir = Join-Path (Split-Path $base -Parent) $outName
            if (Test-Path -LiteralPath $outDir) { Remove-Item -LiteralPath $outDir -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            & 7z.exe x $baseArchive "-o$outDir" -aoa | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "7z extract base for $lang failed: $LASTEXITCODE" }

            node .github/scripts/stage-language-devenv.mjs --app-root $outDir --language $lang --cache-dir (Join-Path $cache $lang)
            if ($LASTEXITCODE -ne 0) { throw "stage-language-devenv failed for $lang" }

            $zip = Join-Path $env:GITHUB_WORKSPACE "dist\$outName.zip"
            if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
            Write-Host "Zipping $outDir -> $zip"
            # 保留顶层目录名（与历史 Compress-Archive 布局一致）
            & 7z.exe a -tzip -mx5 $zip $outDir | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "7z zip $lang failed: $LASTEXITCODE" }

            Remove-Item -LiteralPath $outDir -Recurse -Force
            Write-Host ("Created {0} ({1:N0} bytes)" -f $zip, (Get-Item -LiteralPath $zip).Length)
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-oss-${{ github.run_id }}
          name: Windows x64 OSS (${{ github.run_number }})
          body: |
            自动构建的 Windows x64 桌面版（按语言预装调试环境）。
            - 提交: `${{ github.sha }}`
            - 分支: `${{ github.ref_name }}`

            ## 语言包
            | 文件 | 预装内容 |
            |------|----------|
            | `VSCode-win32-x64-go.zip` | Go + Delve + Go 扩展 |
            | `VSCode-win32-x64-python.zip` | Python 3.14 + debugpy |
            | `VSCode-win32-x64-nodejs.zip` | Node.js LTS |
            | `VSCode-win32-x64-cpp.zip` | CMake + Ninja + MinGW + C/C++ 扩展 |
            | `VSCode-win32-x64-csharp.zip` | .NET 10 SDK + C# 扩展 |
            | `VSCode-win32-x64-rust.zip` | Rust (GNU) + MinGW + rust-analyzer / CodeLLDB |

            首次启动会把包内工具链目录写入用户 PATH（不联网、不拷贝），远控 Pro 即可直接探测到。
          files: dist/VSCode-win32-${{ env.VSCODE_ARCH }}-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
